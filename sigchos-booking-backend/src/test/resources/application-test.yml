spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: localhost

# Configuración falsa del backend/frontend para evitar errores de @Value
app:
  frontend:
    url: "http://localhost:3000"
  jwt:
    secret: "test-secret-key-for-jwt-needs-to-be-long-enough"
    expiration: 3600000

