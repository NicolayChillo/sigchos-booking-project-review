# SMTP Brevo (production-like)
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.sendinblue.com}
spring.mail.port=${BREVO_SMTP_PORT:2525}
spring.mail.username=${BREVO_SMTP_USERNAME:a8cfe2001@smtp-brevo.com}
spring.mail.password=${BREVO_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${BREVO_SMTP_TRUST_HOST:smtp-relay.sendinblue.com}

# Optional: force all outbound emails to one inbox for safe testing
app.notifications.brevo.override-to-email=${APP_NOTIFICATIONS_OVERRIDE_TO_EMAIL:}
