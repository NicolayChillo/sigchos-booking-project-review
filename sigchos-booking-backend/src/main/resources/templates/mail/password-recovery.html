<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body style="margin: 0; padding: 24px 12px; background-color: #f8fafc;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center">
                <table th:replace="~{mail/fragments/layout :: header(${senderName}, ${title}, ${subtitle})}"></table>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; max-width: 640px; margin: 0 auto; background-color: #ffffff; border-left: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb;">
                    <tr>
                        <td style="padding: 24px;">
                            <p style="margin: 0 0 16px 0; font-size: 15px; color: #2d231e;">
                                Hola <strong th:text="${greetingName}">usuario</strong>,
                            </p>
                            <p style="margin: 0 0 12px 0; font-size: 14px; color: #5b4b42; line-height: 20px;">
                                Recibimos una solicitud para restablecer tu contraseña.
                            </p>
                            <p style="margin: 0 0 20px 0; font-size: 14px; color: #5b4b42; line-height: 20px;">
                                Este enlace expira en <strong th:text="${expirationMinutes}">30</strong> minutos.
                            </p>

                            <p style="margin: 0 0 20px 0;">
                                <a th:href="${resetUrl}" style="display: inline-block; padding: 12px 18px; background-color: #835b49; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 14px;">
                                    Restablecer contraseña
                                </a>
                            </p>

                            <p style="margin: 0; font-size: 12px; color: #835b49d5; line-height: 18px;">
                                Si el boton no funciona, copia y pega este enlace en tu navegador:
                            </p>
                            <p style="margin: 8px 0 0 0; font-size: 12px; line-height: 18px; word-break: break-all;">
                                <a th:href="${resetUrl}" th:text="${resetUrl}" style="color: #2d231e;">https://example.com</a>
                            </p>
                        </td>
                    </tr>
                </table>
                <table th:replace="~{mail/fragments/layout :: footer(${footer})}"></table>
            </td>
        </tr>
    </table>
</body>
</html>
