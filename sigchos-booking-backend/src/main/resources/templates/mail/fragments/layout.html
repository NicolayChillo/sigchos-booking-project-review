<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <table th:fragment="header(senderName, title, subtitle)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; max-width: 640px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px;">
        <tr>
            <td style="padding: 24px 24px 8px 24px; background: linear-gradient(135deg, #50bcb2, #f0b832); color: #ffffff; border-radius: 8px 8px 0 0;">
                <p style="margin: 0; font-size: 13px;" th:text="${senderName}">Sigchos booking</p>
                <h1 style="margin: 8px 0 0 0; font-size: 22px; line-height: 28px;" th:text="${title}">Notificacion</h1>
                <p style="margin: 10px 0 0 0; font-size: 14px; line-height: 20px; color: #ffffff;" th:text="${subtitle}">Resumen del mensaje</p>
            </td>
        </tr>
    </table>

    <table th:fragment="footer(footerText)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; max-width: 640px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e5e7eb; border-top: 0; border-radius: 0 0 8px 8px;">
        <tr>
            <td style="padding: 16px 24px 24px 24px;">
                <p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: semi-bold; color: #2d231e;" th:text="${footerText}">Gracias por usar Sigchos booking.</p>
                <p style="margin: 12px 0 0 0; font-size: 12px; color: #835b49d5;">
                    Este es un correo automatico, por favor no respondas a este mensaje.
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
