spring.application.name=sigchos-booking-backend

# Default profile for email provider. Change to mailhog for local SMTP testing.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:brevo}

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigchos_booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true


# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# JWT Configuration (base64-encoded secret)
app.jwt.secret=${JWT_SECRET:Nk+ndVAd85FN0jTwNbe96YVRWM5uq2a+8EJ+xSzniK+vEIHMxJpfsT5JcpjO3SMJUQMFaMyNgPE3AdA3tXsCng==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

# Notifications (Brevo)
app.notifications.brevo.enabled=true
app.notifications.brevo.sender-email=condormateo00@gmail.com
app.notifications.brevo.sender-name=Sigchos booking

# Frontend URL used for password reset links
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# Password reset token expiration
app.security.password-reset.expiration-minutes=30

# System admin bootstrap (set email/password to enable)
app.bootstrap.system-admin.email=adminsigchos@sigchosbooking.com
app.bootstrap.system-admin.password=adminsigchos
app.bootstrap.system-admin.first-name=Administador
app.bootstrap.system-admin.last-name=Sigchos
app.bootstrap.system-admin.phone=0999999999
app.bootstrap.system-admin.birth-date=1990-01-01

