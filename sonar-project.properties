sonar.projectKey=MateoCondor_sigchos-booking-project
sonar.organization=mateocondor
sonar.projectName=Sigchos Booking

# ============================================================
# BACKEND — Spring Boot / Java
# ============================================================
sonar.sources=sigchos-booking-backend/src/main/java,sigchos-booking-frontend-avalon

# Test sources (solo backend; los tests de frontend se excluyen abajo)
sonar.tests=sigchos-booking-backend/src/test/java

# Bytecode compilado (necesario para análisis de Java)
sonar.java.binaries=sigchos-booking-backend/target/classes
sonar.java.source=21

# Reporte de cobertura JaCoCo (generado por `mvn verify`)
sonar.coverage.jacoco.xmlReportPaths=sigchos-booking-backend/target/site/jacoco/jacoco.xml

# ============================================================
# FRONTEND — Next.js / TypeScript
# ============================================================

# Reporte de cobertura Vitest (generado por `vitest run --coverage`)
sonar.javascript.lcov.reportPaths=sigchos-booking-frontend-avalon/coverage/lcov.info

# ============================================================
# EXCLUSIONES DE ANÁLISIS (no analizar estos archivos)
# ============================================================
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/target/**,\
  sigchos-booking-frontend-avalon/mocks/**,\
  sigchos-booking-frontend-avalon/public/**,\
  sigchos-booking-frontend-avalon/styles/**,\
  sigchos-booking-frontend-avalon/lighthouse-reports/**,\
  sigchos-booking-frontend-avalon/.next/**,\
  sigchos-booking-frontend-avalon/coverage/**,\
  **/*.config.js,\
  **/*.config.ts

# ============================================================
# EXCLUSIONES DE COBERTURA (analizar pero no contar en coverage %)
# ============================================================
